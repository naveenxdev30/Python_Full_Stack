
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e46, #39276d, #101d40);
            padding: 20px;
        }

        .login-box {
            width: 400px;
            padding: 45px 40px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            text-align: center;
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #8e5cff, #36b9ff);
            font-size: 40px;
            box-shadow: 0 0 30px rgba(91, 125, 255, 0.5);
        }

        h2 {
            color: white;
            font-size: 30px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #c5c9e5;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #eeeeff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            transition: 0.3s;
        }

        input::placeholder {
            color: #b8bdd7;
        }

        input:focus {
            border-color: #65baff;
            box-shadow: 0 0 15px rgba(65, 165, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #7657ff, #31aaff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(64, 145, 255, 0.5);
        }

        .error {
            color: #ffaaaa;
            background: rgba(255, 50, 50, 0.12);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .footer {
            color: #c0c5df;
            font-size: 12px;
            margin-top: 28px;
        }

        @media (max-width: 450px) {
            .login-box {
                width: 100%;
                padding: 35px 25px;
            }
        }

    </style>
</head>

<body>

    <div class="login-box">

        <div class="icon">
            🎓
        </div>

        <h2>Student Login</h2>

        <p class="subtitle">
            Welcome Back! Please login to your account.
        </p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                LOGIN NOW →
            </button>

        </form>

        <div class="footer">
            © 2026 Student Portal | All Rights Reserved
        </div>

    </div>

</body>
</html>
